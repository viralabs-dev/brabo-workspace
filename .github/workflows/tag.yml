  contents: write
  pull-requests: write
  issues: write
jobs:
  carimbar:
    uses: viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@8e057d044d7921cd0020f63952858b237be2d090  # feature/tag-por-workflow (repinar no merge)
    with:
