name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@f2d99e4f92273318a6a57536b94de205a48ac5cb  # brabo-ci dev, merge da ci#16
    with:
      ci_ref: f2d99e4f92273318a6a57536b94de205a48ac5cb
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@f2d99e4f92273318a6a57536b94de205a48ac5cb  # brabo-ci dev, merge da ci#16
    with:
      ci_ref: f2d99e4f92273318a6a57536b94de205a48ac5cb
