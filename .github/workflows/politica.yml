name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@13f3697aaf3e4a151637755babb58422a44db303  # brabo-ci dev, merge da ci#17
    with:
      ci_ref: 13f3697aaf3e4a151637755babb58422a44db303
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@13f3697aaf3e4a151637755babb58422a44db303  # brabo-ci dev, merge da ci#17
    with:
      ci_ref: 13f3697aaf3e4a151637755babb58422a44db303
