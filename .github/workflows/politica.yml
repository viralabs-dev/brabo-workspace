name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
    with:
      ci_ref: a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
    with:
      ci_ref: a571e82f02edf165142aa298c65ac05213d4687d  # v1.4.0-dev.28
